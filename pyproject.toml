[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pios"
version = "0.0.1"
description = "Terra Finance's event-sourced capital governance engine (scaffold only; learning gate open, see ADR-020)"
readme = "README.md"
requires-python = ">=3.15"
license = { text = "Proprietary — Terra" }
dependencies = ["fastapi>=0.115", "pydantic>=2.12,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

# pios/algo arrives later by git subtree and keeps its own pyproject, tests and migrations (ADR-020).
[tool.hatch.build.targets.wheel]
packages = ["pios"]
exclude = ["pios/algo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py315"
extend-exclude = ["pios/algo"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]

[tool.mypy]
python_version = "3.15"
packages = ["pios"]
exclude = ["^pios/algo/"]
strict = true
plugins = ["pydantic.mypy"]
